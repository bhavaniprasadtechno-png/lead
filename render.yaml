# Render Blueprint — deploys the LeadPilot web app (Next.js dashboard + API)
# as a single Node web service (native runtime, not Docker — Render's
# Docker runtime requires a card on file even on the free plan; native
# Node does not). Database is external (Supabase), so no Render-managed
# Postgres is declared here.
#
# Deploy: Render dashboard → New → Blueprint → select this repo. Render
# reads this file automatically. After the first deploy, fill in the
# `sync: false` env vars below in the service's Environment tab — they
# hold secrets/URLs this blueprint intentionally does not commit.

services:
  - type: web
    name: leadpilot-web
    runtime: node
    buildCommand: npm install && npm run build
    # `db push` (not `migrate deploy`) on purpose: Supabase's other
    # schemas (auth, storage, extensions, ...) make migrate deploy's
    # "is this schema empty?" check fail with P3005 even though `public`
    # — the only schema this app uses — is genuinely fresh. db push just
    # diffs schema.prisma against the live public schema and applies the
    # difference; it's idempotent, so safe to run on every redeploy.
    startCommand: npx prisma db push --accept-data-loss --skip-generate && npm start
    # Free tier: no card required. Tradeoff: spins down after 15 min idle,
    # so the next request (including an n8n webhook call) pays a ~30-60s
    # cold-start instead of failing outright. Switch to "starter" later if
    # that latency becomes a problem.
    plan: free
    region: oregon
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase's *direct* host (db.<ref>.supabase.co) is IPv6-only —
      # unreachable from Render. Use the transaction-mode pooler instead
      # (Supabase dashboard: Settings > Database > Connection string >
      # Transaction pooler), e.g.
      # postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres?pgbouncer=true
      - key: DATABASE_URL
        sync: false
      # Same pooler host, session mode (port 5432, no pgbouncer=true) —
      # Prisma migrations need this instead of the transaction pooler.
      # postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DIRECT_URL
        sync: false
      # Session JWT signing secret — let Render generate one
      - key: AUTH_SECRET
        generateValue: true
      # Bare n8n instance URL, e.g. https://<subdomain>.app.n8n.cloud
      # (the app appends /webhook/<event> itself — see src/lib/n8n.ts)
      - key: N8N_WEBHOOK_BASE_URL
        sync: false
      # Must match N8N_WEBHOOK_SECRET set in n8n (Settings > Variables)
      - key: N8N_WEBHOOK_SECRET
        sync: false
      # Reserved for future BullMQ queues — optional, leave unset until used
      - key: REDIS_URL
        sync: false
