name: leadpilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadpilot
      POSTGRES_PASSWORD: leadpilot
      POSTGRES_DB: leadpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      # Shared secret used by every workflow's Code nodes — must match the
      # web app's N8N_WEBHOOK_SECRET.
      N8N_WEBHOOK_SECRET: replace-with-a-long-random-secret
      APP_BASE_URL: http://web:3000
      SEND_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/imported-workflows:ro

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://leadpilot:leadpilot@postgres:5432/leadpilot?schema=public
      AUTH_SECRET: replace-with-a-long-random-secret
      N8N_WEBHOOK_BASE_URL: http://n8n:5678
      N8N_WEBHOOK_SECRET: replace-with-a-long-random-secret
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
